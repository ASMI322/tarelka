<title>Тарелка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app shell — header, scrolling screen, bottom tab bar. Produce-market palette: sage ground, tomato accent, herb green for "like", grain gold for carbs. */
:root{
  --bg:#F1F4EC; --surface:#FFFFFF; --ink:#1B231D; --muted:#647068; --line:#DCE3D5;
  --accent:#D9532F; --accent-soft:#FBE2D9; --herb:#3B8550; --herb-soft:#DCEEDF; --gold:#E0A332;
  --scrim:rgba(20,26,22,.45);
  --shadow:0 10px 30px rgba(27,35,29,.12);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121613; --surface:#1C221E; --ink:#ECF0E9; --muted:#9AA59C; --line:#2C352F;
  --accent:#F07150; --accent-soft:#3A2420; --herb:#62B37A; --herb-soft:#1F3325; --gold:#E8B54C;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1C221E; --ink:#ECF0E9; --muted:#9AA59C; --line:#2C352F;
  --accent:#F07150; --accent-soft:#3A2420; --herb:#62B37A; --herb-soft:#1F3325; --gold:#E8B54C;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px}
header{display:flex;align-items:center;justify-content:space-between;padding-block:14px 8px}
.logo{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo span{color:var(--accent)}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:4px 16px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px 10px;border-top:1px solid var(--line);background:var(--bg)}
nav button{border:0;background:none;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:500}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink);background:var(--surface)}
nav button[aria-current="page"] svg{color:var(--accent)}

h1{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;margin:4px 0 14px;text-wrap:balance}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Profile */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.inp{position:relative}
.inp input,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;font-variant-numeric:tabular-nums}
.inp input{padding-right:34px}
.inp .unit{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.tiles button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px 10px;display:grid;justify-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.tiles button .ic{font-size:28px;line-height:1}
.tiles button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.ex{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}

.norm{background:var(--ink);color:var(--bg);border-radius:20px;padding:16px;display:grid;gap:12px}
.big{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-family:var(--f-body);font-size:14px;font-weight:500;opacity:.65}
.mbar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:3px}
.mbar i{display:block;height:100%;border-radius:99px}
.mleg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.mleg div{display:grid;gap:1px}
.mleg span{opacity:.7;display:flex;align-items:center;gap:5px}
.mleg span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot)}
.mleg b{font-size:16px}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:600;font-size:15px;background:var(--accent);color:#fff;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}

/* Swipe */
.swipe{display:flex;flex-direction:column;height:100%;min-height:470px;gap:14px}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.stack{position:relative;flex:1;min-height:340px}
.card{position:absolute;inset:0;border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;touch-action:none;user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.card.behind{transform:scale(.94) translateY(12px);opacity:.6;pointer-events:none}
.card .art{font-size:clamp(110px,40vw,170px);line-height:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.15))}
.card .name{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;text-align:center;padding-inline:16px}
.card .count{font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:4px;align-items:center}
.stamp{position:absolute;top:24px;font-family:var(--f-display);font-weight:700;font-size:22px;padding:4px 12px;border:3px solid;border-radius:10px;opacity:0;letter-spacing:.04em}
.stamp.yes{left:22px;color:var(--herb);transform:rotate(-12deg)}
.stamp.no{right:22px;color:var(--accent);transform:rotate(12deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:24px}
.act{width:66px;height:66px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.act svg{width:30px;height:30px}
.act.no{color:var(--accent)} .act.yes{color:var(--herb)}
.act.undo{width:46px;height:46px;color:var(--muted);box-shadow:none}
.act.undo svg{width:20px;height:20px}
.act:disabled{opacity:.35;cursor:default}
.liked-row{display:flex;gap:4px;flex-wrap:wrap;min-height:30px;align-items:center;justify-content:center;font-size:22px}
.done{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px;padding:20px;background:var(--surface);border-radius:28px}
.done .liked-row{font-size:34px;max-width:320px}

/* Menu */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-block:14px 12px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;font-weight:700;font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.meals{display:grid;gap:10px}
.mw{position:relative}
.swap{position:absolute;inset:2px 1px 2px auto;width:140px;padding-left:28px;border:0;border-radius:20px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:grid;place-content:center;justify-items:center;gap:4px}
.swap svg{width:24px;height:24px}
.meal{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 14px 10px 10px;touch-action:pan-y;user-select:none;transition:transform .25s cubic-bezier(.2,.8,.2,1);cursor:grab}
.meal .em{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:36px}
.meal .slot{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.meal .nm{font-weight:600;line-height:1.25;margin-block:1px 3px}
.meal .prods{display:flex;gap:3px;font-size:14px;line-height:1}
.meal .kc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.meal .kc span{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.meal.new{animation:pop .5s}
@keyframes pop{0%{background:var(--herb-soft)}100%{background:var(--surface)}}
.daysum{display:flex;align-items:center;gap:12px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.daysum .ring{width:48px;height:48px;flex:none}
.daysum b{font-size:18px;font-variant-numeric:tabular-nums}
.daysum span{display:block;font-size:12px;color:var(--muted)}
.menu-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tip{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;margin:0 auto;max-width:440px;max-height:78%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom, 0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-family:var(--f-display);font-size:18px;margin:0 0 4px}
.sheet .cur{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:14px}
.sheet .cur s{color:var(--ink)}
.alts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.alt{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:0 0 10px;display:grid;gap:6px;text-align:left;overflow:hidden}
.alt .em{height:86px;display:grid;place-items:center;font-size:46px}
.alt .nm{font-weight:600;font-size:14px;line-height:1.2;padding-inline:10px}
.alt .ft{display:flex;justify-content:space-between;align-items:center;padding-inline:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.alt .ft .prods{font-size:14px}
.empty{text-align:center;color:var(--muted);padding:20px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}

@media (prefers-reduced-motion: reduce){.card,.bar i,.meal,.sheet,.scrim{transition:none;animation:none}}
</style>

<div class="app">
  <header>
    <div class="logo">Тар<span>е</span>лка</div>
    <div class="pill" id="hdr"></div>

  </nav>
</div>

const SLOTS = [{k:'b',n:'Завтрак',share:.25},{k:'l',n:'Обед',share:.35},{k:'d',n:'Ужин',share:.30},{k:'s',n:'Перекус',share:.10}];
const DAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const ACTIVITY = [[1.2,'Сидячий образ жизни'],[1.375,'1–3 тренировки в неделю'],[1.55,'3–5 тренировок в неделю'],[1.725,'6–7 тренировок в неделю'],[1.9,'Физический труд']];
const GOALS = {lose:{n:'Похудеть',ic:'🔥',k:.85,pr:1.8}, keep:{n:'Держать',ic:'⚖️',k:1,pr:1.4}, gain:{n:'Набрать',ic:'💪',k:1.1,pr:1.8}};
const hueOf = id => [...id].reduce((a,ch)=>a+ch.charCodeAt(0)*37,0)%360;
const tint = (id,pct=22) => `color-mix(in oklab, hsl(${hueOf(id)} 70% 58%) ${pct}%, var(--surface))`;

// ---------- State ----------
const KEY='tarelka-v2';
const DEFAULT = {profile:{sex:'f',age:28,height:168,weight:64,activity:1.375,goal:'lose'}, votes:{}, history:[], overrides:{}, seed:7, tab:'profile', day:0, example:true};
let S = (()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.profile)return {...structuredClone(DEFAULT),...s};}catch(e){}return structuredClone(DEFAULT);})();
const save = ()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const fmt = n => Math.round(n).toLocaleString('ru-RU');

// ---------- Nutrition math ----------
function targets(p){
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==='m'?5:-161); // Миффлин — Сан Жеор
  const g = GOALS[p.goal];
  const kcal = Math.max(p.sex==='m'?1500:1200, Math.round(bmr*p.activity*g.k/10)*10);
  const protein = Math.round(p.weight*g.pr), fat = Math.round(kcal*.28/9);
  return {kcal, protein, fat, carbs:Math.max(0,Math.round((kcal-protein*4-fat*9)/4))};
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const likedProducts = () => PRODUCTS.filter(p=>S.votes[p.id]===1);
// null — блюдо с нелюбимым продуктом; иначе число любимых продуктов в нём.
function dishScore(d){
  if(d.t.some(t=>S.votes[t]===-1)) return null;
  return d.t.filter(t=>S.votes[t]===1).length;
}
// Кандидаты для приёма пищи: сначала блюда с любимыми продуктами, если таких нет — любые допустимые.
function candidates(slotK){
  const all = DISHES.filter(d=>d.m.includes(slotK)).map(d=>({d,s:dishScore(d)})).filter(x=>x.s!==null);
  const good = all.filter(x=>x.s>0);
  return good.length ? good : all.length ? all : DISHES.filter(d=>d.m.includes(slotK)).map(d=>({d,s:0}));
}
function portion(d, want){
  const f = Math.min(1.6,Math.max(.6,Math.round(want/d.k*20)/20));
  return {d, f, g:Math.round(d.g*f/10)*10, k:d.k*f, p:d.p*f, fa:d.f*f, c:d.c*f};
}

function buildPlan(){
  const T = targets(S.profile), rng = mulberry32(S.seed), uses = {}, days = [];
  for(let i=0;i<7;i++){
    const meals = [];
    for(const slot of SLOTS){
      const ov = S.overrides[i+slot.k];
      let d;
      if(ov && D[ov] && dishScore(D[ov])!==null) d = D[ov];
      else {
        const prev = days[i-1]?.meals.map(m=>m.d.id)||[], today = meals.map(m=>m.d.id);
        const cands = candidates(slot.k).map(x=>({...x, w:x.s*.6 + rng()*1.6 - (uses[x.d.id]||0)*1.4 - (prev.includes(x.d.id)?4:0) - (today.includes(x.d.id)?10:0)}));
        cands.sort((a,b)=>b.w-a.w); d = cands[0].d;
      }
      uses[d.id]=(uses[d.id]||0)+1;
      meals.push({slot, key:i+slot.k, swapped:!!ov, ...portion(d, T.kcal*slot.share)});
    }
    const sum = k=>meals.reduce((a,m)=>a+m[k],0);
    days.push({meals, k:sum('k'), p:sum('p'), fa:sum('fa'), c:sum('c')});
  }
  return {T, days};
}

// ---------- Rendering ----------
const main = document.getElementById('main');
const ICON = {
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>',
  dice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r=".8" fill="currentColor"/><circle cx="15" cy="15" r=".8" fill="currentColor"/><circle cx="15" cy="9" r=".8" fill="currentColor"/><circle cx="9" cy="15" r=".8" fill="currentColor"/></svg>',
};
const prodIcons = d => d.t.filter(t=>S.votes[t]===1).map(t=>`<span title="${P[t].n}">${P[t].e}</span>`).join('');

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===S.tab?'page':'false'));
  document.getElementById('hdr').textContent = `🔥 ${fmt(targets(S.profile).kcal)} ккал`;
  ({profile:renderProfile, swipe:renderSwipe, menu:renderMenu})[S.tab]();
}

function macroBlock(T){
  const pk=T.protein*4, fk=T.fat*9, ck=T.carbs*4;
  return `<div class="mbar"><i style="flex:${pk};background:var(--herb)"></i><i style="flex:${fk};background:var(--accent)"></i><i style="flex:${ck};background:var(--gold)"></i></div>
    <div class="mleg">
      <div><span style="--dot:var(--herb)">Белки</span><b>${T.protein} г</b></div>
      <div><span style="--dot:var(--accent)">Жиры</span><b>${T.fat} г</b></div>
      <div><span style="--dot:var(--gold)">Углеводы</span><b>${T.carbs} г</b></div>
    </div>`;
}

function renderProfile(){
  const p = S.profile;
  main.innerHTML = `
    <h1>О вас ${S.example?'<span class="ex">пример</span>':''}</h1>
    <div class="form">
      <div class="tiles" id="sexSeg">
        <button data-v="f" aria-pressed="${p.sex==='f'}"><span class="ic">👩</span>Женщина</button>
        <button data-v="m" aria-pressed="${p.sex==='m'}"><span class="ic">👨</span>Мужчина</button>
      </div>
      <div class="row3">
        <div class="field"><label for="age">Возраст</label><div class="inp"><input id="age" type="number" inputmode="numeric" min="14" max="90" value="${p.age}"><span class="unit">лет</span></div></div>
        <div class="field"><label for="height">Рост</label><div class="inp"><input id="height" type="number" inputmode="numeric" min="130" max="230" value="${p.height}"><span class="unit">см</span></div></div>
        <div class="field"><label for="weight">Вес</label><div class="inp"><input id="weight" type="number" inputmode="decimal" min="35" max="250" step="0.1" value="${p.weight}"><span class="unit">кг</span></div></div>
      </div>
      <div class="field"><label for="activity">Активность</label>
        <select id="activity">${ACTIVITY.map(([v,n])=>`<option value="${v}" ${v==p.activity?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="tiles" id="goalSeg">${Object.entries(GOALS).map(([k,g])=>`<button data-v="${k}" aria-pressed="${p.goal===k}"><span class="ic">${g.ic}</span>${g.n}</button>`).join('')}</div>
      <section class="norm" id="norm"></section>
      <button class="btn" id="next">Дальше →</button>
    </div>`;
  const upd = ()=>{
    const T = targets(S.profile);
    document.getElementById('norm').innerHTML = `<div class="big">${fmt(T.kcal)} <small>ккал / день</small></div>${macroBlock(T)}`;
    document.getElementById('hdr').textContent = `🔥 ${fmt(T.kcal)} ккал`;
  };
  const touch = ()=>{ if(S.example){S.example=false; main.querySelector('.ex')?.remove();} save(); upd(); };
  ['age','height','weight'].forEach(id=>document.getElementById(id).addEventListener('input',e=>{const v=parseFloat(e.target.value); if(v>0){S.profile[id]=v; touch();}}));
  document.getElementById('activity').addEventListener('change',e=>{S.profile.activity=parseFloat(e.target.value); touch();});
  const seg = (id,key)=>document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; S.profile[key]=b.dataset.v; e.currentTarget.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); touch();});
  seg('sexSeg','sex'); seg('goalSeg','goal');
  document.getElementById('next').onclick=()=>go('swipe');
  upd();
}

const remaining = () => PRODUCTS.filter(p=>S.votes[p.id]===undefined);
const dishCount = id => DISHES.filter(d=>d.t.includes(id)).length;

function cardHTML(p, behind){
  return `<div class="card${behind?' behind':''}" style="background:${tint(p.id,30)}" ${behind?'aria-hidden="true"':''}>
    <span class="stamp yes">ДА</span><span class="stamp no">НЕТ</span>
    <div class="art">${p.e}</div>
    <div class="name">${p.n}</div>
    <div class="count">🍽 ${dishCount(p.id)}</div></div>`;
}

function renderSwipe(){
  const rest = remaining(), seen = PRODUCTS.length-rest.length;
  const liked = likedProducts().map(p=>`<span title="${p.n}">${p.e}</span>`).join('');
  if(!rest.length){
    main.innerHTML = `<div class="swipe"><div class="done">
      <h1 style="margin:0">Готово</h1>
      <div class="liked-row">${liked||'—'}</div>
      <button class="btn" id="toMenu">Моё меню →</button>
      <button class="btn ghost" id="reset">Заново</button></div></div>`;
    document.getElementById('toMenu').onclick=()=>go('menu');
    document.getElementById('reset').onclick=()=>{S.votes={};S.history=[];S.overrides={};save();render();};
    return;
  }
  main.innerHTML = `<div class="swipe">
    <div class="progress"><div class="bar"><i style="width:${seen/PRODUCTS.length*100}%"></i></div><span>${seen}/${PRODUCTS.length}</span></div>
    <div class="stack" id="stack">${rest[1]?cardHTML(rest[1],true):''}${cardHTML(rest[0],false)}</div>
    <div class="actions">
      <button class="act no" id="bNo" aria-label="Не люблю">${ICON.x}</button>
      <button class="act undo" id="bUndo" aria-label="Вернуть" ${S.history.length?'':'disabled'}>${ICON.undo}</button>
      <button class="act yes" id="bYes" aria-label="Люблю">${ICON.heart}</button>
    </div>
    <div class="liked-row">${liked}</div>
    ${likedProducts().length>=3?'<button class="btn ghost" id="toMenu">Собрать меню →</button>':''}
  </div>`;
  document.getElementById('toMenu')?.addEventListener('click',()=>go('menu'));
  document.getElementById('bNo').onclick=()=>fling(-1);
  document.getElementById('bYes').onclick=()=>fling(1);
  document.getElementById('bUndo').onclick=undo;
  attachCardDrag(document.querySelector('#stack .card:not(.behind)'));
}

let busy=false;
function fling(dir){
  if(busy) return;
  const card = document.querySelector('#stack .card:not(.behind)'); if(!card) return;
  busy=true;
  const p = remaining()[0];
  card.style.transition='transform .3s ease-in, opacity .3s';
  card.style.transform=`translate(${dir*140}%, -20px) rotate(${dir*22}deg)`;
  card.style.opacity='0';
  card.querySelector(dir>0?'.stamp.yes':'.stamp.no').style.opacity=1;
  document.querySelector('#stack .card.behind')?.classList.remove('behind');
  setTimeout(()=>{S.votes[p.id]=dir; S.history.push(p.id); save(); busy=false; render();},230);
}
function undo(){ const k=S.history.pop(); if(k){delete S.votes[k]; save(); render();} }

function attachCardDrag(card){
  let x0=0,y0=0,dx=0,active=false;
  const yes=card.querySelector('.stamp.yes'), no=card.querySelector('.stamp.no');
  card.addEventListener('pointerdown',e=>{active=true;x0=e.clientX;y0=e.clientY;dx=0;card.setPointerCapture(e.pointerId);card.style.transition='none';});
  card.addEventListener('pointermove',e=>{ if(!active)return; dx=e.clientX-x0;
    card.style.transform=`translate(${dx}px,${(e.clientY-y0)*.3}px) rotate(${dx/18}deg)`;
    yes.style.opacity=Math.max(0,Math.min(1,dx/90)); no.style.opacity=Math.max(0,Math.min(1,-dx/90)); });
  const end=()=>{ if(!active)return; active=false;
    if(Math.abs(dx)>90) fling(dx>0?1:-1);
    else { card.style.transition=''; card.style.transform=''; yes.style.opacity=0; no.style.opacity=0; } };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}

// ---------- Menu ----------
let lastSwapped = null;
function ring(val, max){
  const r=20, C=2*Math.PI*r, pct=Math.min(1,val/max);
  return `<svg class="ring" viewBox="0 0 48 48"><circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/>
    <circle cx="24" cy="24" r="${r}" fill="none" stroke="var(--herb)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 24 24)"/></svg>`;
}

function renderMenu(){
  const {T, days} = buildPlan();
  const day = days[S.day];
  main.innerHTML = `
    <section class="norm"><div class="big">${fmt(T.kcal)} <small>ккал / день</small></div>${macroBlock(T)}</section>
    <div class="days" role="group" aria-label="День недели">${DAYS.map((d,i)=>`<button data-i="${i}" aria-pressed="${i===S.day}">${d}</button>`).join('')}</div>
    <div class="meals">${day.meals.map(m=>`
      <div class="mw">
        <button class="swap" data-key="${m.key}" tabindex="-1">${ICON.swap}Заменить</button>
        <div class="meal${lastSwapped===m.key?' new':''}" data-key="${m.key}" tabindex="0" aria-label="${m.slot.n}: ${m.d.n}. Нажмите, чтобы заменить">
          <div class="em" style="background:${tint(m.d.id)}">${m.d.e}</div>
          <div style="min-width:0">
            <div class="slot">${m.slot.n} · ${m.g} г</div>
            <div class="nm">${m.d.n}</div>
            <div class="prods">${prodIcons(m.d)}</div>
          </div>
          <div class="kc">${fmt(m.k)}<span>ккал</span></div>
        </div>
      </div>`).join('')}</div>
    <div class="daysum">${ring(day.k,T.kcal)}<div><b>${fmt(day.k)} / ${fmt(T.kcal)}</b><span>Б ${Math.round(day.p)} · Ж ${Math.round(day.fa)} · У ${Math.round(day.c)} г</span></div></div>
    <div class="menu-actions">
      <button class="btn ghost" id="toSwipe2">🥕 Продукты</button>
      <button class="btn" id="reshuffle">🎲 Другое меню</button>
    </div>
    <div class="tip">← свайпните блюдо, чтобы заменить</div>`;
  lastSwapped = null;
  main.querySelector('.days').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; S.day=+b.dataset.i; save(); renderMenu();});
  document.getElementById('reshuffle').onclick=()=>{S.seed=(S.seed*48271)%2147483647; S.overrides={}; save(); renderMenu();};
  document.getElementById('toSwipe2').onclick=()=>go('swipe');
  main.querySelectorAll('.swap').forEach(b=>b.onclick=()=>openSwap(b.dataset.key, days));
  main.querySelectorAll('.meal').forEach(el=>attachRowSwipe(el, days));
}

// Свайп строки блюда влево открывает кнопку «Заменить».
let openRow = null;
function closeRow(){ if(openRow){openRow.style.transform=''; openRow=null;} }
function attachRowSwipe(el, days){
  const OPEN=-112;
  let x0=0,y0=0,dx=0,base=0,active=false,horiz=null;
  el.addEventListener('pointerdown',e=>{ if(openRow&&openRow!==el)closeRow(); active=true;horiz=null;x0=e.clientX;y0=e.clientY;dx=0;base=openRow===el?OPEN:0; });
  el.addEventListener('pointermove',e=>{ if(!active)return;
    const mx=e.clientX-x0, my=e.clientY-y0;
    if(horiz===null && (Math.abs(mx)>6||Math.abs(my)>6)){ horiz=Math.abs(mx)>Math.abs(my); if(horiz){el.setPointerCapture(e.pointerId);el.style.transition='none';} }
    if(!horiz) return;
    dx=mx; el.style.transform=`translateX(${Math.min(0,Math.max(OPEN*1.3,base+dx))}px)`; });
  const end=()=>{ if(!active)return; active=false; el.style.transition='';
    if(!horiz){ // тап
      if(openRow===el) closeRow(); else openSwap(el.dataset.key, days);
      return; }
    const pos=base+dx;
    if(pos<OPEN/2){ el.style.transform=`translateX(${OPEN}px)`; openRow=el; }
    else { el.style.transform=''; if(openRow===el)openRow=null; } };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',()=>{active=false;el.style.transition='';el.style.transform=openRow===el?`translateX(${OPEN}px)`:'';});
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openSwap(el.dataset.key, days);} });
}

function openSwap(key, days){
  closeRow();
  const di=+key[0], slot=SLOTS.find(s=>s.k===key[1]);
  const T=targets(S.profile), want=T.kcal*slot.share;
  const cur = days[di].meals.find(m=>m.key===key);
  const alts = DISHES.filter(d=>d.m.includes(slot.k) && d.id!==cur.d.id)
    .map(d=>({d,s:dishScore(d)})).filter(x=>x.s!==null)
    .sort((a,b)=>b.s-a.s || Math.abs(a.d.k-want)-Math.abs(b.d.k-want))
    .slice(0,8).map(x=>portion(x.d,want));
  const root=document.getElementById('sheetRoot');
  root.innerHTML = `<div class="scrim" id="scrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Заменить блюдо">
      <div class="grab"></div>
      <h2>${slot.n} · ${DAYS[di]}</h2>
      <div class="cur">${cur.d.e} <s>${cur.d.n}</s></div>
      ${alts.length?`<div class="alts">${alts.map(a=>`
        <button class="alt" data-id="${a.d.id}">
          <div class="em" style="background:${tint(a.d.id)}">${a.d.e}</div>
          <div class="nm">${a.d.n}</div>
          <div class="ft"><span>${fmt(a.k)} ккал</span><span class="prods">${prodIcons(a.d)}</span></div>
        </button>`).join('')}</div>`:'<div class="empty">Нет подходящих замен</div>'}
    </div>`;
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',esc);};
  const esc=e=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',esc);
  document.getElementById('scrim').onclick=close;
  root.querySelectorAll('.alt').forEach(b=>b.onclick=()=>{S.overrides[key]=b.dataset.id; lastSwapped=key; save(); close(); renderMenu();});
  root.querySelector('.alt')?.focus();
}

function go(tab){closeRow(); S.tab=tab; save(); render(); main.scrollTop=0;}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) go(b.dataset.tab);});
document.addEventListener('keydown',e=>{ if(S.tab!=='swipe'||e.target.matches('input,select')||document.getElementById('sheetRoot').innerHTML)return;
  if(e.key==='ArrowRight')fling(1); else if(e.key==='ArrowLeft')fling(-1); else if((e.ctrlKey||e.metaKey)&&e.key==='z')undo(); });
render();
</script>
